apiVersion: apps/v1
kind: Deployment
metadata:
  name: construction-twin-asset-worker
  labels:
    app.kubernetes.io/name: construction-twin-asset-worker
    app.kubernetes.io/version: "0.7.0"
spec:
  replicas: 2
  selector:
    matchLabels: { app: construction-twin-asset-worker }
  template:
    metadata:
      labels: { app: construction-twin-asset-worker }
    spec:
      serviceAccountName: construction-twin
      securityContext:
        runAsNonRoot: true
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: worker
          image: oneai/construction-twin-api:0.7.0
          command: ["python", "-m", "app.workers.asset_worker"]
          envFrom:
            - configMapRef: { name: construction-twin-config }
            - secretRef: { name: construction-twin-secrets }
          env:
            - { name: APP_ENV, value: "production" }
            - { name: AUTO_MIGRATE, value: "false" }
            - { name: REQUIRE_MIGRATION_HEAD, value: "true" }
            - { name: AUTH_MODE, value: "oidc" }
            - { name: ALLOW_DEV_HEADER_AUTH, value: "false" }
            - { name: FORCE_HTTPS, value: "true" }
            - { name: DEMO_ENDPOINTS_ENABLED, value: "false" }
            - { name: ASSET_WORKER_ID, valueFrom: { fieldRef: { fieldPath: metadata.name } } }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
            - { name: data, mountPath: /data }
          resources:
            requests: { cpu: "1", memory: "2Gi" }
            limits: { cpu: "4", memory: "8Gi" }
      volumes:
        - { name: tmp, emptyDir: {} }
        - { name: data, emptyDir: {} }
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: construction-twin-asset-worker
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: construction-twin-asset-worker
  minReplicas: 2
  maxReplicas: 20
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: 70 }
